version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Next 16 needs Node 24 — Amplify's default is older
        - nvm install 24
        - nvm use 24
        - node -v
        - npm ci
    build:
      commands:
        # Prisma client isn't committed (src/generated is gitignored) — regenerate it
        - npx prisma generate
        # Apply pending migrations to the connected database
        - npx prisma migrate deploy
        - npm run build
  artifacts:
    # Next.js SSR build output
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*

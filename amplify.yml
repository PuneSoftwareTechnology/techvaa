version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Next 16 needs Node 24 — Amplify's default is older
        - nvm install 24
        - nvm use 24
        - node -v
        - npm ci
    build:
      commands:
        # Prisma client isn't committed (src/generated is gitignored) — regenerate it
        - npx prisma generate
        # Apply pending migrations to the connected database
        - npx prisma migrate deploy
        # Amplify exposes Console env vars at BUILD time only — its managed
        # Next.js SSR/compute runtime gets none of them. So server code that
        # reads process.env at request time (prisma.ts's DATABASE check, the
        # reCAPTCHA verifier, the revalidate webhook) throws on the live site —
        # most visibly the dynamic /sitemap.xml route 500s, because prisma.ts
        # throws "Missing DATABASE" at import. Write the server-side vars into
        # .env.production so `next build` captures them into the runtime bundle.
        # (NEXT_PUBLIC_* are inlined at build and don't need this.)
        - env | grep -E '^(DATABASE|RECAPTCHA_SECRET_KEY|RECAPTCHA_MIN_SCORE|REVALIDATE_SECRET)=' >> .env.production
        - npm run build
  artifacts:
    # Next.js SSR build output
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
